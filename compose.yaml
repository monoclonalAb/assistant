name: hermes-personal

services:
  gateway:
    image: nousresearch/hermes-agent:latest
    command: ["gateway", "run"]
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${HERMES_DATA_DIR}
        target: /opt/data
      - type: bind
        source: ${HERMES_PROJECT_DIR}
        target: /workspace
      - type: bind
        source: ${HERMES_DATA_DIR}/cache/documents
        target: /output
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped
